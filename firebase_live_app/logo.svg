<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f5" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>

    <linearGradient id="crystalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="crystalMauve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <filter id="crystalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Glass Frame -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="#e9d5ff" stroke-width="4" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Sparkles & Stars -->
  <g fill="#ec4899" opacity="0.7">
    <path d="M120 130 Q120 145 105 145 Q120 145 120 160 Q120 145 135 145 Q120 145 120 130 Z" />
    <path d="M380 140 Q380 152 368 152 Q380 152 380 164 Q380 152 392 152 Q380 152 380 140 Z" />
    <path d="M100 280 Q100 290 90 290 Q100 290 100 300 Q100 290 110 290 Q100 290 100 280 Z" />
    <path d="M400 270 Q400 282 388 282 Q400 282 400 294 Q400 282 412 282 Q400 282 400 270 Z" />
  </g>
  <g fill="#a855f7" opacity="0.6">
    <circle cx="150" cy="180" r="4" />
    <circle cx="350" cy="190" r="5" />
    <circle cx="250" cy="80" r="6" />
  </g>

  <!-- Crystal Flower Vase -->
  <g id="vase" filter="url(#softShadow)">
    <!-- Stems -->
    <path d="M220 230 Q235 270 245 310" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M250 210 Q250 260 250 310" stroke="#059669" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M280 230 Q265 270 255 310" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Glass Vase Body -->
    <path d="M200 290 C180 340, 200 370, 250 370 C300 370, 320 340, 300 290 C290 275, 270 270, 250 270 C230 270, 210 275, 200 290 Z" 
          fill="#ede9fe" fill-opacity="0.6" stroke="#c084fc" stroke-width="3" />
    <!-- Glass highlights -->
    <path d="M210 295 C195 335, 210 355, 230 360" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <circle cx="275" cy="330" r="10" fill="#ffffff" opacity="0.4" />
    
    <!-- Cute Mauve Ribbon Bow -->
    <path d="M250 280 C240 265, 220 265, 225 280 C230 290, 245 285, 250 280 Z" fill="url(#crystalMauve)" />
    <path d="M250 280 C260 265, 280 265, 275 280 C270 290, 255 285, 250 280 Z" fill="url(#crystalMauve)" />
    <circle cx="250" cy="280" r="5" fill="#f43f5e" />
    <path d="M247 283 L238 305" stroke="#9333ea" stroke-width="3" stroke-linecap="round" />
    <path d="M253 283 L262 305" stroke="#9333ea" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Flowers Bouquet (Roses, Peonies & Crystal Petals) -->
  <g id="flowers" filter="url(#crystalGlow)">
    <!-- Left Rose (Pink) -->
    <g transform="translate(195, 190) scale(0.9)">
      <circle cx="0" cy="0" r="35" fill="url(#crystalPink)" opacity="0.9" />
      <path d="M-20 -10 C-10 -30, 20 -30, 25 -5 C28 15, 5 30, -15 20 C-30 10, -30 -5, -20 -10 Z" fill="#fda4af" opacity="0.6" />
      <circle cx="0" cy="0" r="18" fill="#fff1f2" opacity="0.8" />
      <circle cx="0" cy="0" r="8" fill="#be185d" />
    </g>

    <!-- Right Rose (Mauve/Purple) -->
    <g transform="translate(305, 190) scale(0.9)">
      <circle cx="0" cy="0" r="35" fill="url(#crystalMauve)" opacity="0.9" />
      <path d="M-20 -10 C-10 -30, 20 -30, 25 -5 C28 15, 5 30, -15 20 C-30 10, -30 -5, -20 -10 Z" fill="#d8b4fe" opacity="0.6" />
      <circle cx="0" cy="0" r="18" fill="#faf5ff" opacity="0.8" />
      <circle cx="0" cy="0" r="8" fill="#6b21a8" />
    </g>

    <!-- Center Main Royal Crystal Rose -->
    <g transform="translate(250, 150) scale(1.15)">
      <circle cx="0" cy="0" r="42" fill="url(#crystalPink)" />
      <!-- Petals Layer 1 -->
      <path d="M-30 -15 C-20 -40, 20 -40, 30 -15 C40 15, 15 40, -15 35 C-35 30, -40 10, -30 -15 Z" fill="#f472b6" opacity="0.8" />
      <!-- Petals Layer 2 -->
      <path d="M-20 -10 C-10 -28, 20 -25, 22 -5 C24 15, 5 25, -12 20 C-22 15, -25 0, -20 -10 Z" fill="#fbcfe8" opacity="0.9" />
      <!-- Inner bud -->
      <circle cx="0" cy="0" r="14" fill="#fff1f2" />
      <path d="M-5 -4 Q0 -10 5 -4 Q6 4 0 6 Q-6 4 -5 -4 Z" fill="#9d174d" />
    </g>
  </g>

  <!-- Arabic Typography "بيت الورد" -->
  <text x="250" y="420" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-size="38" font-weight="900" fill="#701a75" letter-spacing="1">
    بَيْتُ الْوَرْد
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-size="14" font-weight="700" fill="#a855f7" letter-spacing="4">
    HOUSE OF FLOWERS
  </text>
</svg>
